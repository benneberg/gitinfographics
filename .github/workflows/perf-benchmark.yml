name: Performance Benchmarking & SLAs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: perf-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Engine Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Standalone Packages
        run: npm run build:packages

      - name: Run Performance Benchmark Suite
        run: node scripts/benchmark.mjs
