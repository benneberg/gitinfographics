name: Publish Packages to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run verification (skip actual npm publish)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-publish:
    name: Build, Test & Publish Standalone Packages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # For npm provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Standalone Packages
        run: npm run build:packages

      - name: Verify Packages & Dry-run Tarballs
        run: npm run verify:packages

      - name: Publish to NPM Registry
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event_name == 'release' || github.event_name == 'workflow_dispatch') }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in parser analyzer renderer; do
            echo "Publishing @gitinfographics/$pkg..."
            npm publish ./packages/$pkg --access public --provenance
          done
