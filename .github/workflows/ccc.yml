name: CCC Context Compiler

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ccc:
    name: Generate and validate repository context
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CCC
        run: |
          python -m pip install --upgrade pip
      - name: Install CCC from current main
        run: |
          pip install "git+https://github.com/benneberg/contextcompiler.git@main"

      - name: Show CCC version
        run: |
          ccc --version
          ccc --help

      - name: Generate repository context
        run: |
          ccc --force

      - name: Verify generated context
        shell: bash
        run: |
          set -euo pipefail

          test -d .llm-context

          count=$(find .llm-context -type f | wc -l)

          echo "CCC generated $count artifact file(s)."
          echo
          echo "Generated files:"
          find .llm-context -type f | sort

          echo
          echo "Context directory:"
          du -sh .llm-context

      - name: Inspect generated manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CCC CONTEXT MANIFEST"
          echo "========================================"

          if [ -f .llm-context/context-manifest.json ]; then
            cat .llm-context/context-manifest.json
          else
            echo "context-manifest.json not found"
            exit 1
          fi

      - name: Upload CCC context
        uses: actions/upload-artifact@v4
        with:
          name: ccc-context-${{ github.sha }}
          include-hidden-files: true
          path: .llm-context/
          if-no-files-found: error
          retention-days: 14
