name: CCC Context Compiler

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ccc:
    name: Generate and test repository context
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CCC
        run: |
          python -m pip install --upgrade pip
          pip install ccc-contextcompiler

      - name: Show CCC version
        run: |
          ccc --version
          ccc --help

      - name: Generate repository context
        run: |
          ccc

      - name: Verify generated context
        run: |
          test -d .llm-context

          echo "CCC generated $(find .llm-context -type f | wc -l) artifact file(s)."
          echo
          echo "Generated files:"
          find .llm-context -type f | sort

      - name: Test task-oriented context
        run: |
          ccc context-for "add a new infographic layout" > context-layout.txt
          ccc context-for "change the SVG renderer" > context-renderer.txt
          ccc context-for "add support for a new README content type" > context-content.txt

          echo "Task-context generation completed."

      - name: Show task-context sizes
        run: |
          echo "Layout context:"
          wc -c context-layout.txt

          echo "Renderer context:"
          wc -c context-renderer.txt

          echo "Content context:"
          wc -c context-content.txt

      - name: Upload CCC context
        uses: actions/upload-artifact@v4
        with:
          name: ccc-context-${{ github.sha }}
          include-hidden-files: true
          path: |
            .llm-context/
            context-layout.txt
            context-renderer.txt
            context-content.txt
          if-no-files-found: error
          retention-days: 14
