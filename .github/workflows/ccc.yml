name: CCC Context

on:
  push:
    branches: [main]

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ccc:
    name: Generate repository context
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CCC
        run: python -m pip install --upgrade ccc-contextcompiler

      - name: Generate CCC context
        run: |
          echo "=== CCC version ==="
          ccc --version || true

          echo "=== CCC help ==="
          ccc --help

          echo "=== Running CCC ==="
          ccc

          echo "=== Repository root ==="
          pwd
          ls -la

          echo "=== Generated files ==="
          find . -maxdepth 4 -type f | sort

      - name: Upload CCC context
        uses: actions/upload-artifact@v4
        with:
          name: ccc-context-${{ github.sha }}
          path: .llm-context/
          if-no-files-found: error
          retention-days: 7
    
      - name: Verify CCC output
        run: |
          test -d .llm-context
          test -n "$(find .llm-context -type f -print -quit)"
          echo "CCC generated $(find .llm-context -type f | wc -l) artifact file(s)."

     
