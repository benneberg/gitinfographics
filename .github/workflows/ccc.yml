name: CCC Context Compiler

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ccc:
    name: Generate and test repository context
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CCC
        run: |
          python -m pip install --upgrade pip
          pip install ccc-contextcompiler
          pip install pyyaml

      - name: Show CCC version
        run: |
          ccc --version
          ccc --help

      - name: Generate repository context
        run: |
          ccc

      - name: Verify generated context
        run: |
          test -d .llm-context

          count=$(find .llm-context -type f | wc -l)

          echo "CCC generated $count artifact file(s)."
          echo
          echo "Generated files:"
          find .llm-context -type f | sort
          
      - name: Initialize CCC workspace
        run: |
          ccc workspace init
          echo
          echo "Workspace files:"
          find . -maxdepth 2 -name "ccc-workspace.yml" -o -name ".ccc*" | sort
          
      - name: Test task-oriented context
        run: |
          set +e

          echo "=== Layout ==="
          ccc context-for "add a new infographic layout" \
            > context-layout.txt \
            2> context-layout-error.txt
          layout_exit=$?
          echo "Exit code: $layout_exit"

          echo
          echo "=== Renderer ==="
          ccc context-for "change the SVG renderer" \
            > context-renderer.txt \
            2> context-renderer-error.txt
          renderer_exit=$?
          echo "Exit code: $renderer_exit"

          echo
          echo "=== README/content ==="
          ccc context-for "add support for a new README content type" \
            > context-content.txt \
            2> context-content-error.txt
          content_exit=$?
          echo "Exit code: $content_exit"

          echo
          echo "=== Errors ==="

          for file in \
            context-layout-error.txt \
            context-renderer-error.txt \
            context-content-error.txt
          do
            echo "--- $file ---"
            if [ -s "$file" ]; then
              cat "$file"
            else
              echo "(empty)"
            fi
          done

          echo
          echo "=== Result sizes ==="

          wc -c \
            context-layout.txt \
            context-renderer.txt \
            context-content.txt

          echo
          echo "Task-context experiments completed."

      - name: Inspect context-for output
        run: |
          echo "========================================"
          echo "LAYOUT CONTEXT"
          echo "========================================"
          cat context-layout.txt

          echo
          echo "========================================"
          echo "RENDERER CONTEXT"
          echo "========================================"
          cat context-renderer.txt

          echo
          echo "========================================"
          echo "README / CONTENT CONTEXT"
          echo "========================================"
          cat context-content.txt

      - name: Upload CCC context
        uses: actions/upload-artifact@v4
        with:
          name: ccc-context-${{ github.sha }}
          include-hidden-files: true
          path: |
            .llm-context/
            context-layout.txt
            context-layout-error.txt
            context-renderer.txt
            context-renderer-error.txt
            context-content.txt
            context-content-error.txt
          if-no-files-found: error
          retention-days: 14
