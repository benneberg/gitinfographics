name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Security best practice: restrict default permissions
permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build

      # Optional but highly recommended: saves the built files so you can 
      # inspect them or deploy them later without rebuilding.
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/ # ⚠️ Change to 'build/' if you are using Create React App
          retention-days: 7
