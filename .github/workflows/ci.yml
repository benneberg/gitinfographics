name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Security best practice: restrict default permissions
permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Type Check & Lint
        run: bun run lint

      - name: Run Unit Tests
        run: bun run test

      - name: Build Production Assets
        run: bun run build

      # Saves the built files so you can inspect them or deploy them later
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/ # Matches Vite's default output and your "clean" script
          retention-days: 7
